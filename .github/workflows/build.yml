name: Compila APK

# Ogni push su main compila un APK di prova e lo pubblica nel ramo build-output
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compila
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Pubblica APK e log sul ramo build-output
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/Outflow.apk 2>/dev/null || true
          echo "commit=${GITHUB_SHA}" > /tmp/out/info.txt
          echo "esito=${{ steps.build.outcome }}" >> /tmp/out/info.txt
          date -u >> /tmp/out/info.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-output-new
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/* .
          git add -A
          git commit -m "Build ${GITHUB_SHA::7} (${{ steps.build.outcome }})"
          for i in 1 2 3; do git push -f origin HEAD:build-output && break; sleep 5; done

      - name: Esito
        if: steps.build.outcome != 'success'
        run: exit 1
